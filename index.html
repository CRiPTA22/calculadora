<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>

  <!-- Conecta el CSS -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="calculadora">
    <h1>Calculadora</h1>

    <label for="operacion">Operación</label>
    <select id="operacion">
      <option value="1">➕ Suma</option>
      <option value="2">➖ Resta</option>
      <option value="3">✖️ Multiplicación</option>
      <option value="4">➗ División</option>
    </select>

    <label for="num1">Primer número</label>
    <input type="number" id="num1" placeholder="0">

    <label for="num2">Segundo número</label>
    <input type="number" id="num2" placeholder="0">

    <button id="calcular">Calcular</button>

    <div class="resultado" id="resultado">Resultado aparecerá aquí</div>
  </div>

  <!-- Conecta el JavaScript (al final del body) -->
  <script src="script.js"></script>
</body>
</html>
